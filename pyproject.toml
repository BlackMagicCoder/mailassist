[project]
name = "mailassist"
version = "0.1.0"
description = "KI-Antwortentwürfe für Proton Mail über Baryon MCP und NanoGPT – sendet nie selbst"
authors = [
    { name = "Kira Bouschen", email = "kira.bouschen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.2",
    "python-dotenv>=1.2",
    "python-telegram-bot>=22.8",
]

[project.scripts]
mailassist = "mailassist.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
